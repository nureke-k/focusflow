<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow — Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <main class="app">
    <header class="brand">
      <span class="logo">◐</span>
      <div>
        <h1 class="title">FocusFlow</h1>
        <p class="subtitle">Stay in the zone, one session at a time.</p>
      </div>
    </header>

    <div class="modes" role="tablist">
      <button class="mode active" data-minutes="25" role="tab">Focus</button>
      <button class="mode" data-minutes="5" role="tab">Short Break</button>
      <button class="mode" data-minutes="15" role="tab">Long Break</button>
    </div>

    <div class="dial">
      <svg class="ring" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c5cff" />
            <stop offset="100%" stop-color="#ff5c8a" />
          </linearGradient>
        </defs>
        <circle class="ring-track" cx="120" cy="120" r="110" />
        <circle class="ring-progress" id="ringProgress" cx="120" cy="120" r="110" />
      </svg>
      <div class="dial-center">
        <div class="clock" id="clock" title="Click the numbers to set a custom time">
          <input class="seg" id="minVal" type="text" inputmode="numeric" maxlength="2" value="25" aria-label="Minutes" />
          <span class="colon">:</span>
          <input class="seg" id="secVal" type="text" inputmode="numeric" maxlength="2" value="00" aria-label="Seconds" />
        </div>
        <div class="phase" id="phase">Focus</div>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="btn primary">
        <span class="btn-icon">▶</span><span id="startLabel">Start</span>
      </button>
      <button id="resetBtn" class="btn ghost" aria-label="Reset">↺</button>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="rounds">0</span>
        <span class="stat-label">Sessions</span>
      </div>
      <div class="divider"></div>
      <div class="stat">
        <span class="stat-value" id="focusTime">0m</span>
        <span class="stat-label">Focused</span>
      </div>
    </div>
  </main>

  <footer class="footer">Open source under the MIT License</footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=3"></script>
</body>
</html>
